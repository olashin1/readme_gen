[project]
name = "readme-gen"
version = "0.1.0"
description = "A CLI tool that analyzes a project and generates a README."
readme = "README.md"
authors = [
    { name = "Omar", email = "omarlashin29@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.18.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "typer>=0.27.1",
]

[project.scripts]
readme-gen = "readme_gen.main:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
